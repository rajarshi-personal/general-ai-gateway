[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "general-ai-gateway"
version = "0.1.0"
description = "Policy-controlled asynchronous gateway for AI services"
authors = [{name = "Rajarshi"}]
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "redis>=5.2,<7", "prometheus-client>=0.21,<1", "PyJWT[crypto]>=2.15.1,<3"
]
[project.urls]
Source = "https://github.com/rajarshi-personal/general-ai-gateway"
Issues = "https://github.com/rajarshi-personal/general-ai-gateway/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "fakeredis[lua]>=2.28,<3"]
[project.scripts]
general_ai_gateway = "general_ai_gateway.cli:main"
[tool.setuptools.packages.find]
include = ["general_ai_gateway*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
